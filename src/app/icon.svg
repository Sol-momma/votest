<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand color background, generous corner radius like the home page logo -->
  <rect width="64" height="64" rx="15" fill="#2E75CC"/>

  <!-- Calendar binders (top tabs) -->
  <rect x="20" y="12" width="5" height="12" rx="2.5" fill="#FFFFFF"/>
  <rect x="39" y="12" width="5" height="12" rx="2.5" fill="#FFFFFF"/>

  <!-- White calendar body -->
  <rect x="12" y="20" width="40" height="32" rx="5" fill="#FFFFFF"/>

  <!-- Header strip in soft accent blue -->
  <path d="M12 25 Q 12 20 17 20 L 47 20 Q 52 20 52 25 L 52 28 L 12 28 Z" fill="#D9E7F4"/>

  <!-- Center O (vote mark) — ring -->
